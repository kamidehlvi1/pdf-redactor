{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Active Directory Management</h2>
            <a href="{{ url_for('admin_panel') }}" class="btn btn-outline-secondary">Local Admin</a>
        </div>

        <div class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i> Ensure your <code>LDAP_BIND_DN</code> service account has write
            permissions in AD.
        </div>

        <div class="row">
            <!-- Create User -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">Create AD User</div>
                    <div class="card-body">
                        <form action="{{ url_for('ad_create_user') }}" method="POST">
                            <div class="form-group">
                                <label>Username (sAMAccountName)</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" name="firstname" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" name="lastname" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" name="email" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Initial Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Create User</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Create Group -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white">Create AD Group</div>
                    <div class="card-body">
                        <form action="{{ url_for('ad_create_group') }}" method="POST">
                            <div class="form-group">
                                <label>Group Name</label>
                                <input type="text" name="groupname" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-block">Create Group</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Add to Group -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-info text-white">Add User to Group</div>
                    <div class="card-body">
                        <form action="{{ url_for('ad_add_to_group') }}" method="POST">
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Group Name</label>
                                <input type="text" name="groupname" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-info btn-block">Add to Group</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
