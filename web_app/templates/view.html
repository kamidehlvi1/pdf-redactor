<!DOCTYPE html>
<html>

<head>
    <title>Secure View</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }

        #content-area {
            display: none;
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 20px;
            background: #f9f9f9;
        }

        #timer {
            font-size: 2em;
            color: red;
        }
    </style>
</head>

<body>
    <h1>Secure Document View</h1>

    <div id="login-area">
        <p>This content is encrypted. Enter password to view.</p>
        <input type="password" id="password" placeholder="Password">
        <button onclick="decrypt()">Decrypt</button>
        <p id="error-msg" style="color: red;"></p>
    </div>

    <div id="content-area">
        <h2>Decrypted Content</h2>
        <div id="timer">60</div>
        <pre id="decrypted-text" style="text-align: left; white-space: pre-wrap;"></pre>
    </div>

    <script>
        var filename = "{{ filename }}";

        function decrypt() {
            var password = document.getElementById('password').value;

            fetch('/api/decrypt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: filename, password: password })
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        return response.json().then(data => { throw new Error(data.error); });
                    }
                })
                .then(data => {
                    document.getElementById('login-area').style.display = 'none';
                    document.getElementById('content-area').style.display = 'block';
                    document.getElementById('decrypted-text').textContent = data.text;
                    startTimer();
                })
                .catch(error => {
                    document.getElementById('error-msg').textContent = error.message;
                });
        }

        function startTimer() {
            var timeLeft = 60;
            var timerElem = document.getElementById('timer');

            var interval = setInterval(function () {
                timeLeft--;
                timerElem.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    document.getElementById('content-area').innerHTML = "<h2>Session Expired</h2><p>The content has been wiped from memory.</p>";
                }
            }, 1000);
        }
    </script>
</body>

</html>
